<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AtomicLyrics — lyrics, decomposed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e141c;
    --bg-deep:#0a0f15;
    --panel:#141c27;
    --panel-raised:#182130;
    --hairline:#25313f;
    --ink:#eae6db;
    --ink-dim:#8b96a5;
    --ink-faint:#4d5867;
    --brass:#d4a24c;
    --brass-soft:#8c733a;
    --teal:#5eead4;
    --teal-deep:#1f6f63;
    --danger:#e2725b;
    --radius-sm:6px;
    --radius-md:12px;
    --radius-lg:20px;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --dock-h:150px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 12% -10%, rgba(94,234,212,0.06), transparent 40%),
      radial-gradient(circle at 88% 0%, rgba(212,162,76,0.07), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--teal-deep); color:var(--ink); }

  .app{ height:100dvh; display:flex; flex-direction:column; }

  /* ---------- header ---------- */
  .app-header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:18px 26px 14px;
    border-bottom:1px solid var(--hairline);
    background:linear-gradient(180deg, rgba(20,28,39,0.9), rgba(20,28,39,0));
  }
  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .brand-mark{
    width:40px; height:40px; flex:0 0 auto;
    border:1.5px solid var(--brass);
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:700; font-size:19px;
    color:var(--brass);
    position:relative;
    box-shadow: inset 0 0 12px rgba(212,162,76,0.12);
  }
  .brand-mark::after{
    content:'89';
    position:absolute; top:1px; left:3px;
    font-size:6px; letter-spacing:0.5px; color:var(--brass-soft);
    font-family:var(--font-mono);
  }
  .brand-text h1{
    margin:0; font-family:var(--font-display); font-weight:600;
    font-size:21px; letter-spacing:0.2px; color:var(--ink);
  }
  .brand-text p{ margin:1px 0 0; font-size:11.5px; color:var(--ink-dim); letter-spacing:0.3px; }
  .now-playing{
    font-family:var(--font-mono); font-size:12px; color:var(--teal);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:42vw;
    padding:6px 12px;
    border:1px solid var(--teal-deep);
    border-radius:100px;
    background:rgba(94,234,212,0.05);
  }
  .now-playing .np-sep{ color:var(--ink-faint); margin:0 6px; }
  .now-playing #npArtist{ color:var(--ink-dim); }

  /* ---------- lyrics viewport ---------- */
  .lyrics-viewport{
    flex:1 1 auto;
    overflow-y:auto;
    padding:8vh 18px calc(var(--dock-h) + 6vh);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 48px, #000 calc(100% - 60px), transparent 100%);
            mask-image:linear-gradient(to bottom, transparent 0, #000 48px, #000 calc(100% - 60px), transparent 100%);
    scrollbar-width:thin;
    scrollbar-color:var(--hairline) transparent;
  }
  .lyrics-viewport::-webkit-scrollbar{ width:6px; }
  .lyrics-viewport::-webkit-scrollbar-thumb{ background:var(--hairline); border-radius:4px; }

  .empty-state{
    max-width:420px; margin:8vh auto 0; text-align:center; color:var(--ink-dim);
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .empty-tile{
    width:64px; height:64px; border:2px dashed var(--hairline); border-radius:var(--radius-md);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; color:var(--ink-faint);
  }
  .empty-tile .tile-num{ font-size:9px; font-family:var(--font-mono); }
  .empty-tile .tile-sym{ font-size:22px; font-family:var(--font-mono); font-weight:700; }
  .empty-state p{ margin:0; font-size:14.5px; line-height:1.6; }
  .empty-state .hint-sub{ font-size:12px; color:var(--ink-faint); }

  .lyrics-stream{ max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:6px; }

  .lyric-line{
    padding:9px 16px; border-radius:var(--radius-md); cursor:pointer;
    display:flex; flex-wrap:wrap; align-items:center; gap:0; row-gap:6px;
    line-height:1.5; transition:background-color .25s ease, opacity .25s ease, transform .2s ease;
    opacity:0.35; outline:none;
  }
  .lyric-line:hover{ background:rgba(255,255,255,0.035); opacity:0.75; }
  .lyric-line:focus-visible{ box-shadow:0 0 0 2px var(--teal); opacity:0.9; }
  .lyric-line.active{
    opacity:1;
    transform:scale(1.02);
    background:linear-gradient(90deg, rgba(94,234,212,0.08), rgba(94,234,212,0.02) 60%, transparent);
  }
  .lyric-line.active .tile{
    border-color:var(--teal);
    box-shadow:0 0 10px rgba(94,234,212,0.3);
  }
  .lyric-line.active .tile .tile-sym{ color:var(--teal); }
  .lyric-line.no-sync{ cursor:default; }

  .word{ display:inline-flex; align-items:center; margin:0 6px 0 0; }
  .raw{ font-family:var(--font-body); color:var(--ink-dim); font-size:15px; white-space:pre-wrap; }

  .tile{
    position:relative; display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
    width:32px; height:34px; margin:0 1.5px; border:1.5px solid var(--hairline); border-radius:6px;
    background:var(--panel-raised); transition:border-color .2s ease, transform .15s ease, box-shadow .2s ease;
    user-select:none;
  }
  .lyric-line:hover .tile{ transform:translateY(-1px); }
  .tile .tile-num{ position:absolute; top:2px; left:3px; font-family:var(--font-mono); font-size:6px; color:var(--brass); letter-spacing:0.2px; line-height:1; }
  .tile .tile-sym{ font-family:var(--font-mono); font-weight:700; font-size:13px; color:var(--ink); line-height:1; margin-top:3px; }

  /* ---------- dock ---------- */
  .dock{
    flex:0 0 auto;
    border-top:1px solid var(--hairline);
    background:linear-gradient(180deg, rgba(14,20,28,0), var(--bg-deep) 30%);
    padding:12px 18px calc(14px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:8px;
    z-index:20;
  }
  .player-bar{ display:flex; align-items:center; gap:12px; max-width:760px; width:100%; margin:0 auto; }
  .play-btn{
    flex:0 0 auto; width:38px; height:38px; border-radius:50%;
    border:1.5px solid var(--brass); background:rgba(212,162,76,0.08); color:var(--brass);
    font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .2s ease, transform .1s ease;
  }
  .play-btn:hover{ background:rgba(212,162,76,0.18); }
  .play-btn:active{ transform:scale(0.94); }
  .play-btn:disabled{ opacity:0.4; cursor:default; }
  .time{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim); flex:0 0 auto; min-width:38px; text-align:center; }
  .scrub{ -webkit-appearance:none; appearance:none; flex:1 1 auto; height:4px; border-radius:3px; background:var(--hairline); outline:none; cursor:pointer; }
  .scrub::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:12px; height:12px; border-radius:50%;
    background:var(--teal); border:2px solid var(--bg-deep); cursor:pointer;
  }
  .scrub::-moz-range-thumb{ width:12px; height:12px; border-radius:50%; background:var(--teal); border:2px solid var(--bg-deep); cursor:pointer; }
  .scrub::-webkit-slider-runnable-track{ height:4px; border-radius:3px; background:var(--hairline); }

  .search-row{ display:flex; flex-direction:column; gap:6px; max-width:760px; width:100%; margin:0 auto; }
  .search-bar{ display:flex; gap:8px; width:100%; }
  .search-bar input{
    flex:1 1 auto; background:var(--panel); border:1.5px solid var(--hairline); border-radius:100px;
    padding:11px 18px; color:var(--ink); font-family:var(--font-body); font-size:14px; outline:none;
    transition:border-color .2s ease;
  }
  .search-bar input::placeholder{ color:var(--ink-faint); }
  .search-bar input:focus{ border-color:var(--teal-deep); }
  .search-bar button{
    flex:0 0 auto; background:var(--brass); color:#20180a; border:none; border-radius:100px;
    padding:0 20px; font-family:var(--font-body); font-weight:600; font-size:13.5px; cursor:pointer;
    letter-spacing:0.2px; transition:filter .15s ease, transform .1s ease;
  }
  .search-bar button:hover{ filter:brightness(1.08); }
  .search-bar button:active{ transform:scale(0.97); }
  .search-bar button:disabled{ opacity:0.55; cursor:progress; }

  .search-status{
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim);
    padding:0 18px; min-height:16px;
  }
  .search-status.error{ color:var(--danger); }
  .search-status .dot{
    width:6px; height:6px; border-radius:50%; background:var(--teal); flex:0 0 auto;
    animation:pulse 1.1s ease-in-out infinite;
  }
  .search-status.error .dot{ background:var(--danger); animation:none; }
  @keyframes pulse{ 0%,100%{ opacity:0.35; } 50%{ opacity:1; } }

  /* Stable, non-throttled offscreen placement */
  .yt-holder{
    position:fixed;
    bottom:0;
    right:0;
    width:200px;
    height:120px;
    transform:translateY(200%);
    pointer-events:none;
    z-index:-1;
  }

  [hidden]{ display:none !important; }

  @media (max-width: 640px){
    .app-header{ padding:14px 16px 10px; }
    .brand-text h1{ font-size:18px; }
    .brand-text p{ display:none; }
    .now-playing{ max-width:38vw; font-size:10.5px; }
    .lyrics-viewport{ padding:6vh 10px calc(var(--dock-h) + 5vh); }
    .lyric-line{ padding:8px 8px; font-size:14px; }
    .tile{ width:28px; height:30px; }
    .tile .tile-sym{ font-size:12px; }
    .dock{ padding:10px 12px calc(12px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">Ly</span>
      <div class="brand-text">
        <h1>AtomicLyrics</h1>
        <p>lyrics, decomposed into the periodic table</p>
      </div>
    </div>
    <div class="now-playing" id="nowPlaying" hidden>
      <span id="npTitle"></span><span class="np-sep">·</span><span id="npArtist"></span>
    </div>
  </header>

  <main class="lyrics-viewport" id="lyricsViewport">
    <div class="empty-state" id="emptyState">
      <div class="empty-tile"><span class="tile-num">0</span><span class="tile-sym">?</span></div>
      <p>Search any song below. Lyrics and YouTube audio load automatically — every line gets decomposed into chemical elements.</p>
      <p class="hint-sub">Try "Radioactive", "Believer", "Kesariya", or "Gehra Hua".</p>
    </div>
    <div class="lyrics-stream" id="lyricsStream"></div>
  </main>

  <footer class="dock">
    <div class="player-bar" id="playerBar">
      <button class="play-btn" id="playBtn" aria-label="Play">▶</button>
      <span class="time" id="timeCurrent">00:00</span>
      <input type="range" class="scrub" id="scrub" min="0" max="1000" value="0" aria-label="Seek">
      <span class="time" id="timeTotal">00:00</span>
    </div>
    <div class="search-row">
      <form class="search-bar" id="searchForm">
        <input type="text" id="searchInput" placeholder="Search a track — title, artist, or both" autocomplete="off">
        <button type="submit" id="searchBtn">Search &amp; Play</button>
      </form>
      <div class="search-status" id="searchStatus"></div>
    </div>
  </footer>
</div>

<div class="yt-holder"><div id="ytPlayer"></div></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
(function(){
  'use strict';

  /* 1. All 118 Periodic Table Elements */
  const ELEMENTS = {
    H:[1,'Hydrogen'], He:[2,'Helium'], Li:[3,'Lithium'], Be:[4,'Beryllium'], B:[5,'Boron'],
    C:[6,'Carbon'], N:[7,'Nitrogen'], O:[8,'Oxygen'], F:[9,'Fluorine'], Ne:[10,'Neon'],
    Na:[11,'Sodium'], Mg:[12,'Magnesium'], Al:[13,'Aluminium'], Si:[14,'Silicon'], P:[15,'Phosphorus'],
    S:[16,'Sulfur'], Cl:[17,'Chlorine'], Ar:[18,'Argon'], K:[19,'Potassium'], Ca:[20,'Calcium'],
    Sc:[21,'Scandium'], Ti:[22,'Titanium'], V:[23,'Vanadium'], Cr:[24,'Chromium'], Mn:[25,'Manganese'],
    Fe:[26,'Iron'], Co:[27,'Cobalt'], Ni:[28,'Nickel'], Cu:[29,'Copper'], Zn:[30,'Zinc'],
    Ga:[31,'Gallium'], Ge:[32,'Germanium'], As:[33,'Arsenic'], Se:[34,'Selenium'], Br:[35,'Bromine'],
    Kr:[36,'Krypton'], Rb:[37,'Rubidium'], Sr:[38,'Strontium'], Y:[39,'Yttrium'], Zr:[40,'Zirconium'],
    Nb:[41,'Niobium'], Mo:[42,'Molybdenum'], Tc:[43,'Technetium'], Ru:[44,'Ruthenium'], Rh:[45,'Rhodium'],
    Pd:[46,'Palladium'], Ag:[47,'Silver'], Cd:[48,'Cadmium'], In:[49,'Indium'], Sn:[50,'Tin'],
    Sb:[51,'Antimony'], Te:[52,'Tellurium'], I:[53,'Iodine'], Xe:[54,'Xenon'], Cs:[55,'Caesium'],
    Ba:[56,'Barium'], La:[57,'Lanthanum'], Ce:[58,'Cerium'], Pr:[59,'Praseodymium'], Nd:[60,'Neodymium'],
    Pm:[61,'Promethium'], Sm:[62,'Samarium'], Eu:[63,'Europium'], Gd:[64,'Gadolinium'], Tb:[65,'Terbium'],
    Dy:[66,'Dysprosium'], Ho:[67,'Holmium'], Er:[68,'Erbium'], Tm:[69,'Thulium'], Yb:[70,'Ytterbium'],
    Lu:[71,'Lutetium'], Hf:[72,'Hafnium'], Ta:[73,'Tantalum'], W:[74,'Tungsten'], Re:[75,'Rhenium'],
    Os:[76,'Osmium'], Ir:[77,'Iridium'], Pt:[78,'Platinum'], Au:[79,'Gold'], Hg:[80,'Mercury'],
    Tl:[81,'Thallium'], Pb:[82,'Lead'], Bi:[83,'Bismuth'], Po:[84,'Polonium'], At:[85,'Astatine'],
    Rn:[86,'Radon'], Fr:[87,'Francium'], Ra:[88,'Radium'], Ac:[89,'Actinium'], Th:[90,'Thorium'],
    Pa:[91,'Protactinium'], U:[92,'Uranium'], Np:[93,'Neptunium'], Pu:[94,'Plutonium'], Am:[95,'Americium'],
    Cm:[96,'Curium'], Bk:[97,'Berkelium'], Cf:[98,'Californium'], Es:[99,'Einsteinium'], Fm:[100,'Fermium'],
    Md:[101,'Mendelevium'], No:[102,'Nobelium'], Lr:[103,'Lawrencium'], Rf:[104,'Rutherfordium'], Db:[105,'Dubnium'],
    Sg:[106,'Seaborgium'], Bh:[107,'Bohrium'], Hs:[108,'Hassium'], Mt:[109,'Meitnerium'], Ds:[110,'Darmstadtium'],
    Rg:[111,'Roentgenium'], Cn:[112,'Copernicium'], Nh:[113,'Nihonium'], Fl:[114,'Flerovium'], Mc:[115,'Moscovium'],
    Lv:[116,'Livermorium'], Ts:[117,'Tennessine'], Og:[118,'Oganesson']
  };

  /* 2. Memoized DP Chemical Decomposer */
  function decomposeWord(word){
    const n = word.length;
    const memo = new Array(n + 1);
    memo[n] = { score: 0, choice: 'end' };

    function solve(i){
      if (memo[i] !== undefined) return memo[i];
      let best = { score: -Infinity, choice: 'skip' };

      if (i + 2 <= n){
        const sub = word.slice(i, i + 2);
        const canon = sub[0].toUpperCase() + sub[1].toLowerCase();
        if (ELEMENTS[canon]){
          const rest = solve(i + 2);
          const score = rest.score + 3;
          if (score > best.score) best = { score, choice: 'sym2', canon };
        }
      }
      {
        const canon1 = word[i].toUpperCase();
        if (ELEMENTS[canon1]){
          const rest = solve(i + 1);
          const score = rest.score + 1;
          if (score > best.score) best = { score, choice: 'sym1', canon: canon1 };
        }
      }
      {
        const rest = solve(i + 1);
        const score = rest.score;
        if (score > best.score) best = { score, choice: 'skip' };
      }

      memo[i] = best;
      return best;
    }

    for (let i = n - 1; i >= 0; i--) solve(i);

    const segments = [];
    let i = 0, rawBuf = '';
    const flushRaw = () => { if (rawBuf){ segments.push({ type:'raw', text: rawBuf }); rawBuf = ''; } };

    while (i < n){
      const step = memo[i];
      if (step.choice === 'sym2'){
        flushRaw();
        const [num, name] = ELEMENTS[step.canon];
        segments.push({ type:'element', symbol: step.canon, num, name, original: word.slice(i, i+2) });
        i += 2;
      } else if (step.choice === 'sym1'){
        flushRaw();
        const [num, name] = ELEMENTS[step.canon];
        segments.push({ type:'element', symbol: step.canon, num, name, original: word.slice(i, i+1) });
        i += 1;
      } else {
        rawBuf += word[i];
        i += 1;
      }
    }
    flushRaw();
    return segments;
  }

  function decomposeLine(text){
    if (!text || !text.trim()) return [{ type:'raw', text:'♪' }];
    const tokens = text.match(/[A-Za-z]+|[^A-Za-z]+/g) || [];
    const out = [];
    for (const tok of tokens){
      if (/[A-Za-z]/.test(tok)) out.push({ type:'word', segments: decomposeWord(tok) });
      else out.push({ type:'raw', text: tok });
    }
    return out;
  }

  /* 3. LRC Parser */
  function parseLRC(lrc){
    const TIME = /\[(\d{1,2}):(\d{2}(?:\.\d{1,3})?)\]/g;
    const lines = lrc.split(/\r?\n/);
    const rows = [];
    for (const raw of lines){
      TIME.lastIndex = 0;
      const times = [];
      let m;
      while ((m = TIME.exec(raw)) !== null){
        times.push(parseInt(m[1], 10) * 60 + parseFloat(m[2]));
      }
      if (!times.length) continue;
      const text = raw.replace(TIME, '').trim();
      for (const t of times) rows.push({ time: t, text });
    }
    rows.sort((a, b) => a.time - b.time);
    return rows;
  }

  function formatTime(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  /* 4. Rendering */
  const lyricsViewport = document.getElementById('lyricsViewport');
  const lyricsStream = document.getElementById('lyricsStream');
  const emptyState = document.getElementById('emptyState');

  function buildLineElement(lineObj, index){
    const el = document.createElement('div');
    el.className = 'lyric-line' + (lineObj.time === null ? ' no-sync' : '');
    el.dataset.index = String(index);
    if (lineObj.time !== null) el.dataset.time = String(lineObj.time);
    el.tabIndex = lineObj.time !== null ? 0 : -1;

    const segs = decomposeLine(lineObj.text);
    for (const seg of segs){
      if (seg.type === 'raw'){
        const span = document.createElement('span');
        span.className = 'raw';
        span.textContent = seg.text;
        el.appendChild(span);
      } else {
        const wordEl = document.createElement('span');
        wordEl.className = 'word';
        for (const s of seg.segments){
          if (s.type === 'element'){
            const tile = document.createElement('span');
            tile.className = 'tile';
            tile.title = s.name + ' (' + s.symbol + ')';
            const numEl = document.createElement('span');
            numEl.className = 'tile-num';
            numEl.textContent = s.num;
            const symEl = document.createElement('span');
            symEl.className = 'tile-sym';
            symEl.textContent = s.symbol;
            tile.appendChild(numEl);
            tile.appendChild(symEl);
            wordEl.appendChild(tile);
          } else {
            const raw = document.createElement('span');
            raw.className = 'raw';
            raw.textContent = s.text;
            wordEl.appendChild(raw);
          }
        }
        el.appendChild(wordEl);
      }
    }

    if (lineObj.time !== null){
      el.addEventListener('click', () => seekTo(lineObj.time));
    }
    return el;
  }

  function renderLyrics(lines){
    lyricsStream.innerHTML = '';
    const frag = document.createDocumentFragment();
    lines.forEach((line, idx) => frag.appendChild(buildLineElement(line, idx)));
    lyricsStream.appendChild(frag);
    emptyState.hidden = true;
    lyricsViewport.scrollTop = 0;
  }

  /* 5. LRCLIB Integration */
  async function fetchLyrics(query){
    const searchUrl = 'https://lrclib.net/api/search?q=' + encodeURIComponent(query);
    const res = await fetch(searchUrl);
    if (!res.ok) throw new Error('LRCLIB failed');
    const list = await res.json();
    if (!list || !list.length) return null;
    return list.find(t => t.syncedLyrics && t.syncedLyrics.trim()) || list[0];
  }

  /* 6. Multi-Provider YouTube Resolver */
  const YT_SEARCH_ENDPOINTS = [
    (q) => `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(q)}&filter=videos`,
    (q) => `https://api.piped.privacydev.net/search?q=${encodeURIComponent(q)}&filter=videos`,
    (q) => `https://yewtu.be/api/v1/search?q=${encodeURIComponent(q)}&type=video`,
    (q) => `https://inv.nadeko.net/api/v1/search?q=${encodeURIComponent(q)}&type=video`,
    (q) => `https://invidious.nerdvpn.de/api/v1/search?q=${encodeURIComponent(q)}&type=video`
  ];

  async function resolveYouTubeVideoId(trackName, artistName){
    const cleanTrack = trackName.replace(/\(.*?\)/g, '').replace(/\[.*?\]/g, '').trim();
    const query = `${cleanTrack} ${artistName || ''} official audio`.trim();

    const fetchers = YT_SEARCH_ENDPOINTS.map(async (fn) => {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 4500);
      try {
        const res = await fetch(fn(query), { signal: controller.signal });
        clearTimeout(timeout);
        if (!res.ok) throw new Error();
        const data = await res.json();
        const items = data.items || data;
        if (Array.isArray(items) && items.length > 0){
          const first = items[0];
          const vid = first.videoId || (first.url && first.url.replace('/watch?v=', ''));
          if (vid && vid.length >= 8) return vid;
        }
        throw new Error();
      } catch (err){
        clearTimeout(timeout);
        throw err;
      }
    });

    try {
      return await Promise.any(fetchers);
    } catch {
      return null;
    }
  }

  /* 7. YouTube IFrame Player */
  let ytApiReady = false;
  let player = null;
  let pendingVideoId = null;
  let playerReadyOnce = false;

  window.onYouTubeIframeAPIReady = function(){
    ytApiReady = true;
    player = new YT.Player('ytPlayer', {
      height: '120', width: '200',
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, modestbranding: 1, rel: 0, playsinline: 1 },
      events: { onReady: onPlayerReady, onStateChange: onPlayerStateChange }
    });
  };

  function onPlayerReady(){
    playerReadyOnce = true;
    if (pendingVideoId){
      player.loadVideoById(pendingVideoId);
      pendingVideoId = null;
    }
  }

  function onPlayerStateChange(e){
    const playBtn = document.getElementById('playBtn');
    if (e.data === YT.PlayerState.PLAYING){
      playBtn.textContent = '⏸';
      playBtn.setAttribute('aria-label', 'Pause');
    } else {
      playBtn.textContent = '▶';
      playBtn.setAttribute('aria-label', 'Play');
    }
  }

  function loadYouTubeVideo(videoId){
    if (!ytApiReady || !player || !playerReadyOnce){
      pendingVideoId = videoId;
      return;
    }
    player.loadVideoById(videoId);
  }

  function seekTo(seconds){
    if (player && playerReadyOnce && typeof player.seekTo === 'function'){
      player.seekTo(seconds, true);
      if (player.getPlayerState() !== YT.PlayerState.PLAYING) player.playVideo();
    }
  }

  /* 8. UI & Player Synchronization */
  const searchStatus = document.getElementById('searchStatus');
  function setStatus(text, mode){
    if (!text){ searchStatus.innerHTML = ''; return; }
    searchStatus.className = 'search-status' + (mode === 'error' ? ' error' : '');
    searchStatus.innerHTML = (mode === 'error' ? '' : '<span class="dot"></span>') + '<span>' + text + '</span>';
  }

  const playBtn = document.getElementById('playBtn');
  const scrub = document.getElementById('scrub');
  const timeCurrent = document.getElementById('timeCurrent');
  const timeTotal = document.getElementById('timeTotal');
  let currentLines = [];
  let lastActiveIndex = -1;
  let scrubbing = false;

  playBtn.addEventListener('click', () => {
    if (!player || !playerReadyOnce) return;
    const state = player.getPlayerState();
    if (state === YT.PlayerState.PLAYING) player.pauseVideo();
    else player.playVideo();
  });

  scrub.addEventListener('input', () => { scrubbing = true; });
  scrub.addEventListener('change', () => {
    if (!player || !playerReadyOnce) return;
    const duration = player.getDuration() || 0;
    const target = (scrub.value / 1000) * duration;
    player.seekTo(target, true);
    scrubbing = false;
  });

  function updateActiveLine(currentTime){
    if (!currentLines.length) return;
    let idx = -1;
    for (let i = 0; i < currentLines.length; i++){
      if (currentLines[i].time !== null && currentLines[i].time <= currentTime) idx = i;
      else if (currentLines[i].time !== null) break;
    }
    if (idx === lastActiveIndex) return;
    lastActiveIndex = idx;
    const children = lyricsStream.children;
    for (const child of children) child.classList.remove('active');
    if (idx >= 0 && children[idx]){
      children[idx].classList.add('active');
      children[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  setInterval(() => {
    if (!player || !playerReadyOnce || typeof player.getCurrentTime !== 'function') return;
    let current = 0, duration = 0;
    try {
      current = player.getCurrentTime() || 0;
      duration = player.getDuration() || 0;
    } catch (e){ return; }

    timeCurrent.textContent = formatTime(current);
    timeTotal.textContent = formatTime(duration);
    if (!scrubbing && duration > 0){
      scrub.value = String(Math.round((current / duration) * 1000));
    }
    updateActiveLine(current);
  }, 250);

  /* 9. Search Flow */
  const searchForm = document.getElementById('searchForm');
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');

  searchForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = searchInput.value.trim();
    if (!q) return;

    searchBtn.disabled = true;
    searchBtn.textContent = 'Searching…';
    setStatus('Fetching lyrics & recording…');

    try {
      const track = await fetchLyrics(q);
      if (!track){
        setStatus('No matching lyrics found. Try adding the artist name.', 'error');
        return;
      }

      let lines;
      if (track.syncedLyrics && track.syncedLyrics.trim()){
        lines = parseLRC(track.syncedLyrics);
      } else if (track.plainLyrics && track.plainLyrics.trim()){
        lines = track.plainLyrics.split(/\r?\n/).filter(l => l.trim()).map(text => ({ time: null, text }));
      } else {
        lines = [{ time: null, text: '(Instrumental / No lyrics available)' }];
      }

      currentLines = lines;
      lastActiveIndex = -1;
      renderLyrics(lines);

      document.getElementById('npTitle').textContent = track.trackName || q;
      document.getElementById('npArtist').textContent = track.artistName || '';
      document.getElementById('nowPlaying').hidden = false;

      const videoId = await resolveYouTubeVideoId(track.trackName || q, track.artistName || '');
      if (videoId){
        loadYouTubeVideo(videoId);
        setStatus('');
      } else {
        setStatus('Lyrics loaded. Audio stream not found.', 'error');
      }
    } catch (err){
      setStatus('Search failed. Check your network connection.', 'error');
    } finally {
      searchBtn.disabled = false;
      searchBtn.textContent = 'Search & Play';
    }
  });

})();
</script>
