<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AtomicLyrics</title>
  <style>
    :root {
      --bg: #090e17;
      --card-bg: #111927;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .logo-badge {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #090e17;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .track-meta {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .status-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .song-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--accent);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Lyrics Display Area */
    #lyrics-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 24px 14px 180px;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .lyric-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px;
      opacity: 0.35;
      transform: scale(0.96);
      transition: opacity 0.25s ease, transform 0.25s ease;
      cursor: pointer;
      line-height: 1.6;
      width: 100%;
      max-width: 700px;
    }

    .lyric-line.active {
      opacity: 1;
      transform: scale(1.03);
    }

    .word-box {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: rgba(30, 41, 59, 0.45);
      padding: 3px 5px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* Periodic Table Tile */
    .element-tile {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 36px;
      height: 42px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: 1px solid #7dd3fc;
      border-radius: 5px;
      padding: 2px 3px;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.2);
      user-select: none;
      flex-shrink: 0;
    }

    .lyric-line.active .element-tile {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }

    .element-tile .atomic-num {
      font-size: 0.5rem;
      align-self: flex-start;
      color: #bae6fd;
      font-weight: 700;
      line-height: 1;
    }

    .element-tile .symbol {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
    }

    .element-tile .name {
      font-size: 0.42rem;
      color: #e0f2fe;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 30px;
      line-height: 1;
    }

    .plain-char {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0 2px;
    }

    /* Bottom Control Bar & Search */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 12px 16px env(safe-area-inset-bottom, 12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 30;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.5);
    }

    .footer-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0b121e;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .play-btn {
      background: var(--accent);
      color: #090e17;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: transform 0.15s ease, background 0.2s ease;
      flex-shrink: 0;
    }

    .play-btn:hover {
      background: #7dd3fc;
      transform: scale(1.05);
    }

    .seek-slider {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #1e293b;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
    }

    .time-readout {
      font-size: 0.75rem;
      color: var(--text-muted);
      min-width: 75px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #090e17;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .search-btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #090e17;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease;
    }

    .status-text {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <span class="logo-badge">AtomicLyrics</span>
    <div class="track-meta">
      <div class="status-label">PLAYING SONG</div>
      <div class="song-title" id="track-name">Search a song to play</div>
    </div>
  </header>

  <!-- HTML5 Native Audio element (Reliable across all mobile browsers) -->
  <audio id="audio-engine" preload="auto"></audio>

  <!-- Lyrics Container -->
  <main id="lyrics-viewport">
    <p style="color: var(--text-muted); margin-top: 40px; text-align: center;">
      Enter any track or artist name below to play music & stream periodic lyrics.
    </p>
  </main>

  <!-- Bottom Dock -->
  <footer>
    <div class="footer-container">
      <div class="player-row">
        <button class="play-btn" id="toggle-play-btn" title="Play/Pause">▶</button>
        <input type="range" id="seek-bar" class="seek-slider" min="0" max="100" value="0">
        <span class="time-readout" id="time-display">0:00 / 0:00</span>
      </div>

      <div class="search-row">
        <input type="text" id="search-input" placeholder="Search track (e.g. 'Gehra Hua', 'Radioactive')..." />
        <button class="search-btn" id="search-btn">Search & Play</button>
      </div>

      <div class="status-text" id="status-display">Ready</div>
    </div>
  </footer>

  <script>
    // 1. Periodic Table Elements Map
    const ELEMENTS = {
      H: { n: 1, name: "Hydrog" }, HE: { n: 2, name: "Helium" },
      LI: { n: 3, name: "Lithium" }, BE: { n: 4, name: "Berylli" },
      B: { n: 5, name: "Boron" }, C: { n: 6, name: "Carbon" },
      N: { n: 7, name: "Nitrog" }, O: { n: 8, name: "Oxygen" },
      F: { n: 9, name: "Fluorin" }, NE: { n: 10, name: "Neon" },
      NA: { n: 11, name: "Sodium" }, MG: { n: 12, name: "Magnes" },
      AL: { n: 13, name: "Alumin" }, SI: { n: 14, name: "Silicon" },
      P: { n: 15, name: "Phosph" }, S: { n: 16, name: "Sulfur" },
      CL: { n: 17, name: "Chlori" }, AR: { n: 18, name: "Argon" },
      K: { n: 19, name: "Potassi" }, CA: { n: 20, name: "Calcium" },
      SC: { n: 21, name: "Scandi" }, TI: { n: 22, name: "Titani" },
      V: { n: 23, name: "Vanadi" }, CR: { n: 24, name: "Chromi" },
      MN: { n: 25, name: "Mangan" }, FE: { n: 26, name: "Iron" },
      CO: { n: 27, name: "Cobalt" }, NI: { n: 28, name: "Nickel" },
      CU: { n: 29, name: "Copper" }, ZN: { n: 30, name: "Zinc" },
      GA: { n: 31, name: "Gallium" }, GE: { n: 32, name: "Germa" },
      AS: { n: 33, name: "Arsenic" }, SE: { n: 34, name: "Seleniu" },
      BR: { n: 35, name: "Bromine" }, KR: { n: 36, name: "Krypton" },
      RB: { n: 37, name: "Rubidi" }, SR: { n: 38, name: "Stronti" },
      Y: { n: 39, name: "Yttrium" }, ZR: { n: 40, name: "Zircon" },
      NB: { n: 41, name: "Niobium" }, MO: { n: 42, name: "Molybd" },
      TC: { n: 43, name: "Techne" }, RU: { n: 44, name: "Ruthen" },
      RH: { n: 45, name: "Rhodium" }, PD: { n: 46, name: "Pallad" },
      AG: { n: 47, name: "Silver" }, CD: { n: 48, name: "Cadmiu" },
      IN: { n: 49, name: "Indium" }, SN: { n: 50, name: "Tin" },
      SB: { n: 51, name: "Antim" }, TE: { n: 52, name: "Tellur" },
      I: { n: 53, name: "Iodine" }, XE: { n: 54, name: "Xenon" },
      CS: { n: 55, name: "Cesium" }, BA: { n: 56, name: "Barium" },
      LA: { n: 57, name: "Lanthan" }, CE: { n: 58, name: "Cerium" },
      AU: { n: 79, name: "Gold" }, HG: { n: 80, name: "Mercury" },
      PB: { n: 82, name: "Lead" }, U: { n: 92, name: "Uraniu" },
      PU: { n: 94, name: "Pluton" }
    };

    // 2. DP Backtracking Solver for Chemical Spelling
    function findOptimalDecomposition(word) {
      const memo = new Map();

      function solve(index) {
        if (index >= word.length) return { score: 0, tokens: [] };
        if (memo.has(index)) return memo.get(index);

        let bestResult = null;

        if (index + 2 <= word.length) {
          const sub2 = word.slice(index, index + 2).toUpperCase();
          if (ELEMENTS[sub2]) {
            const next = solve(index + 2);
            const candidate = {
              score: next.score + 10,
              tokens: [{
                symbol: word[index].toUpperCase() + word[index + 1].toLowerCase(),
                info: ELEMENTS[sub2],
                isElement: true
              }, ...next.tokens]
            };
            if (!bestResult || candidate.score > bestResult.score) bestResult = candidate;
          }
        }

        const sub1 = word[index].toUpperCase();
        if (ELEMENTS[sub1]) {
          const next = solve(index + 1);
          const candidate = {
            score: next.score + 5,
            tokens: [{
              symbol: sub1,
              info: ELEMENTS[sub1],
              isElement: true
            }, ...next.tokens]
          };
          if (!bestResult || candidate.score > bestResult.score) bestResult = candidate;
        }

        const fallbackNext = solve(index + 1);
        const fallback = {
          score: fallbackNext.score - 1,
          tokens: [{
            symbol: word[index],
            info: null,
            isElement: false
          }, ...fallbackNext.tokens]
        };
        if (!bestResult || fallback.score > bestResult.score) bestResult = fallback;

        memo.set(index, bestResult);
        return bestResult;
      }

      return solve(0).tokens;
    }

    function renderLineElements(lineText) {
      return lineText.split(/\s+/).map(word => {
        if (!word) return '';
        const tokens = findOptimalDecomposition(word);
        const innerTiles = tokens.map(t => {
          if (t.isElement) {
            return `
              <div class="element-tile">
                <span class="atomic-num">${t.info.n}</span>
                <span class="symbol">${t.symbol}</span>
                <span class="name">${t.info.name}</span>
              </div>
            `;
          }
          return `<span class="plain-char">${t.symbol}</span>`;
        }).join('');

        return `<div class="word-box">${innerTiles}</div>`;
      }).join(' ');
    }

    // 3. LRC Parser
    function parseLRC(lrcText) {
      const lines = lrcText.split('\n');
      const result = [];
      const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

      lines.forEach(line => {
        const match = line.match(timeRegex);
        if (match) {
          const minutes = parseInt(match[1], 10);
          const seconds = parseInt(match[2], 10);
          const ms = parseFloat('0.' + match[3]);
          const totalSeconds = minutes * 60 + seconds + ms;
          const text = line.replace(timeRegex, '').trim();
          if (text) result.push({ time: totalSeconds, text });
        }
      });
      return result.sort((a, b) => a.time - b.time);
    }

    // 4. Audio Engine & UI Binding
    const audio = document.getElementById('audio-engine');
    const playBtn = document.getElementById('toggle-play-btn');
    const seekBar = document.getElementById('seek-bar');
    const timeDisplay = document.getElementById('time-display');
    const statusText = document.getElementById('status-display');
    const trackName = document.getElementById('track-name');
    const viewport = document.getElementById('lyrics-viewport');

    let lyricsData = [];
    let isUserSeeking = false;

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60) || 0;
      const secs = Math.floor(seconds % 60) || 0;
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    audio.addEventListener('play', () => { playBtn.textContent = '⏸'; });
    audio.addEventListener('pause', () => { playBtn.textContent = '▶'; });

    audio.addEventListener('timeupdate', () => {
      const currentSec = audio.currentTime;
      const duration = audio.duration || 0;

      if (!isUserSeeking && duration > 0) {
        seekBar.value = (currentSec / duration) * 100;
        timeDisplay.textContent = `${formatTime(currentSec)} / ${formatTime(duration)}`;
      }

      if (lyricsData.length === 0) return;

      lyricsData.forEach((line, idx) => {
        const nextLine = lyricsData[idx + 1];
        const lineElem = document.getElementById(`lyric-${idx}`);

        if (currentSec >= line.time && (!nextLine || currentSec < nextLine.time)) {
          if (lineElem && !lineElem.classList.contains('active')) {
            document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
            lineElem.classList.add('active');
            lineElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
      });
    });

    // 5. Direct Audio Stream & Synced Lyrics Search
    async function searchAndPlay(query) {
      statusText.textContent = `Finding audio & lyrics for "${query}"...`;
      trackName.textContent = query;
      lyricsData = [];

      // Step A: Fetch Synced Lyrics from LRCLIB
      try {
        const lyricsRes = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`);
        const lyricsList = await lyricsRes.json();

        if (lyricsList && lyricsList.length > 0) {
          const track = lyricsList[0];
          trackName.textContent = `${track.artistName} - ${track.trackName}`;
          viewport.innerHTML = '';

          if (track.syncedLyrics) {
            lyricsData = parseLRC(track.syncedLyrics);
            lyricsData.forEach((line, idx) => {
              const lineDiv = document.createElement('div');
              lineDiv.className = 'lyric-line';
              lineDiv.id = `lyric-${idx}`;
              lineDiv.innerHTML = renderLineElements(line.text);
              
              lineDiv.addEventListener('click', () => {
                audio.currentTime = line.time;
                audio.play();
              });
              viewport.appendChild(lineDiv);
            });
            statusText.textContent = "Synced periodic lyrics loaded.";
          } else if (track.plainLyrics) {
            track.plainLyrics.split('\n').forEach(text => {
              if (!text.trim()) return;
              const lineDiv = document.createElement('div');
              lineDiv.className = 'lyric-line active';
              lineDiv.innerHTML = renderLineElements(text);
              viewport.appendChild(lineDiv);
            });
            statusText.textContent = "Loaded plain lyrics without timestamps.";
          }
        } else {
          viewport.innerHTML = `<p style="color: var(--text-muted); margin-top: 40px;">No lyrics found for "${query}". You can find the full lyrics by searching for the song on Google.</p>`;
          statusText.textContent = "Lyrics not found.";
        }
      } catch (err) {
        viewport.innerHTML = `<p style="color: var(--text-muted); margin-top: 40px;">Unable to fetch lyrics. You can find the full lyrics by searching for the song on Google.</p>`;
      }

      // Step B: Resolve Audio Stream via Piped API
      try {
        const pipedSearch = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query)}&filter=videos`);
        const searchData = await pipedSearch.json();

        if (searchData.items && searchData.items.length > 0) {
          const videoId = searchData.items[0].url.replace('/watch?v=', '');
          const videoDetails = await (await fetch(`https://pipedapi.kavin.rocks/streams/${videoId}`)).json();
          
          if (videoDetails.audioStreams && videoDetails.audioStreams.length > 0) {
            // Pick high quality audio stream
            const streamUrl = videoDetails.audioStreams[0].url;
            audio.src = streamUrl;
            audio.play().catch(() => {
              statusText.textContent = "Tap Play (▶) to begin audio playback";
            });
            return;
          }
        }
      } catch (e) {
        console.warn("Direct stream resolution fallback active.");
      }

      // Fallback Demo Sound if external streaming API is blocked by ISP
      audio.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
      audio.play().catch(() => {
        statusText.textContent = "Tap Play (▶) to begin playback";
      });
    }

    // 6. User Control Listeners
    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });

    seekBar.addEventListener('mousedown', () => { isUserSeeking = true; });
    seekBar.addEventListener('touchstart', () => { isUserSeeking = true; });

    seekBar.addEventListener('change', () => {
      if (audio.duration) {
        audio.currentTime = (seekBar.value / 100) * audio.duration;
      }
      isUserSeeking = false;
    });

    document.getElementById('search-btn').addEventListener('click', () => {
      const val = document.getElementById('search-input').value.trim();
      if (val) searchAndPlay(val);
    });

    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const val = document.getElementById('search-input').value.trim();
        if (val) searchAndPlay(val);
      }
    });
  </script>
</body>
</html>
