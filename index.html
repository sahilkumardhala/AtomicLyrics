<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AtomicLyrics — YouTube Periodic Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090e17;
    --panel: #111927;
    --hairline: #1e293b;
    --ink: #f8fafc;
    --ink-dim: #94a3b8;
    --ink-faint: #64748b;
    --cyan: #38bdf8;
    --dock-h: 140px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .app-header {
    background: var(--panel);
    border-bottom: 1px solid var(--hairline);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    z-index: 10;
  }
  .brand-badge {
    background: #0ea5e9;
    color: #031120;
    font-weight: 800;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }
  .track-meta {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    text-align: right;
  }
  .status-label {
    font-size: 0.65rem;
    color: var(--ink-faint);
    text-transform: uppercase;
    font-weight: 600;
  }
  .song-title {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--cyan);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Main Viewport */
  .lyrics-viewport {
    flex: 1;
    overflow-y: auto;
    padding: 24px 12px calc(var(--dock-h) + 30px);
    scroll-behavior: smooth;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .lyrics-viewport::-webkit-scrollbar { width: 5px; }
  .lyrics-viewport::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 4px; }

  .lyric-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 6px;
    opacity: 0.35;
    transform: scale(0.96);
    transition: opacity 0.25s ease, transform 0.25s ease;
    cursor: pointer;
    line-height: 1.8;
    width: 100%;
    max-width: 720px;
  }
  .lyric-line.active {
    opacity: 1;
    transform: scale(1.02);
  }

  .word-box {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    background: rgba(19, 29, 46, 0.4);
    padding: 2px 4px;
    border-radius: 6px;
  }

  /* Periodic Table Cards (Cyan Glowing Gradient) */
  .element-tile {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    width: 36px;
    height: 42px;
    background: linear-gradient(135deg, #0284c7, #0369a1);
    border: 1px solid #7dd3fc;
    border-radius: 6px;
    padding: 2px 3px;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
    user-select: none;
    flex-shrink: 0;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  .lyric-line.active .element-tile {
    background: linear-gradient(135deg, #38bdf8, #0284c7);
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.65);
    border-color: #bae6fd;
  }
  .element-tile .atomic-num {
    font-size: 0.5rem;
    align-self: flex-start;
    color: #bae6fd;
    font-weight: 700;
    line-height: 1;
    font-family: 'JetBrains Mono', monospace;
  }
  .element-tile .symbol {
    font-size: 0.95rem;
    font-weight: 700;
    color: #ffffff;
    line-height: 1;
    font-family: 'JetBrains Mono', monospace;
  }
  .element-tile .name {
    font-size: 0.42rem;
    color: #e0f2fe;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 30px;
    line-height: 1;
  }

  .plain-char {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--ink-faint);
    padding: 0 2px;
  }

  /* YouTube IFrame Holder */
  .yt-container {
    position: fixed;
    bottom: 0;
    right: 0;
    width: 200px;
    height: 120px;
    transform: translateY(200%);
    pointer-events: none;
    z-index: -1;
  }

  /* Bottom Dock Controls */
  footer.dock {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: var(--panel);
    border-top: 1px solid var(--hairline);
    padding: 12px 16px env(safe-area-inset-bottom, 12px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 30;
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.6);
  }
  .footer-container {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .player-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #0b121e;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--hairline);
  }
  .play-btn {
    background: var(--cyan);
    color: #090e17;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1rem;
    font-weight: bold;
    flex-shrink: 0;
  }
  .seek-slider {
    flex: 1;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: #1e293b;
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  .seek-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--cyan);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.7);
  }
  .time-readout {
    font-size: 0.75rem;
    color: var(--ink-faint);
    min-width: 75px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-family: 'JetBrains Mono', monospace;
  }

  .search-row { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--hairline);
    background: #090e17;
    color: var(--ink);
    font-size: 0.95rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--cyan); }
  .search-btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: var(--cyan);
    color: #090e17;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .status-text {
    text-align: center;
    font-size: 0.75rem;
    color: var(--ink-dim);
  }
</style>
</head>
<body>

  <header class="app-header">
    <span class="brand-badge">AtomicLyrics</span>
    <div class="track-meta">
      <div class="status-label">PLAYING SONG</div>
      <div class="song-title" id="trackName">Search any song below...</div>
    </div>
  </header>

  <!-- Off-Screen YouTube IFrame Player -->
  <div class="yt-container">
    <div id="ytPlayerTarget"></div>
  </div>

  <!-- Scrolling Lyrics Container -->
  <main class="lyrics-viewport" id="lyricsViewport">
    <p style="color: var(--ink-faint); margin-top: 40px; text-align: center;">
      Search any track (e.g. "Gehra Hua", "Kesariya", "Believer") to start YouTube audio & periodic lyrics.
    </p>
  </main>

  <!-- Bottom Dock Controls -->
  <footer class="dock">
    <div class="footer-container">
      <div class="player-row">
        <button class="play-btn" id="togglePlayBtn" title="Play/Pause">▶</button>
        <input type="range" id="seekBar" class="seek-slider" min="0" max="100" value="0">
        <span class="time-readout" id="timeDisplay">0:00 / 0:00</span>
      </div>

      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Search track name..." autocomplete="off">
        <button class="search-btn" id="searchBtn">Search &amp; Play</button>
      </div>

      <div class="status-text" id="statusDisplay">Ready</div>
    </div>
  </footer>

  <  <!-- 1. Official YouTube IFrame API Script Tag -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    // 1. Full Periodic Table Elements
    const ELEMENTS = {
      H: { n: 1, name: "Hydrog" }, HE: { n: 2, name: "Helium" },
      LI: { n: 3, name: "Lithium" }, BE: { n: 4, name: "Berylli" },
      B: { n: 5, name: "Boron" }, C: { n: 6, name: "Carbon" },
      N: { n: 7, name: "Nitrog" }, O: { n: 8, name: "Oxygen" },
      F: { n: 9, name: "Fluorin" }, NE: { n: 10, name: "Neon" },
      NA: { n: 11, name: "Sodium" }, MG: { n: 12, name: "Magnes" },
      AL: { n: 13, name: "Alumin" }, SI: { n: 14, name: "Silicon" },
      P: { n: 15, name: "Phosph" }, S: { n: 16, name: "Sulfur" },
      CL: { n: 17, name: "Chlori" }, AR: { n: 18, name: "Argon" },
      K: { n: 19, name: "Potassi" }, CA: { n: 20, name: "Calcium" },
      SC: { n: 21, name: "Scandi" }, TI: { n: 22, name: "Titani" },
      V: { n: 23, name: "Vanadi" }, CR: { n: 24, name: "Chromi" },
      MN: { n: 25, name: "Mangan" }, FE: { n: 26, name: "Iron" },
      CO: { n: 27, name: "Cobalt" }, NI: { n: 28, name: "Nickel" },
      CU: { n: 29, name: "Copper" }, ZN: { n: 30, name: "Zinc" },
      GA: { n: 31, name: "Gallium" }, GE: { n: 32, name: "Germa" },
      AS: { n: 33, name: "Arsenic" }, SE: { n: 34, name: "Seleniu" },
      BR: { n: 35, name: "Bromine" }, KR: { n: 36, name: "Krypton" },
      RB: { n: 37, name: "Rubidi" }, SR: { n: 38, name: "Stronti" },
      Y: { n: 39, name: "Yttrium" }, ZR: { n: 40, name: "Zircon" },
      NB: { n: 41, name: "Niobium" }, MO: { n: 42, name: "Molybd" },
      TC: { n: 43, name: "Techne" }, RU: { n: 44, name: "Ruthen" },
      RH: { n: 45, name: "Rhodium" }, PD: { n: 46, name: "Pallad" },
      AG: { n: 47, name: "Silver" }, CD: { n: 48, name: "Cadmiu" },
      IN: { n: 49, name: "Indium" }, SN: { n: 50, name: "Tin" },
      SB: { n: 51, name: "Antim" }, TE: { n: 52, name: "Tellur" },
      I: { n: 53, name: "Iodine" }, XE: { n: 54, name: "Xenon" },
      CS: { n: 55, name: "Cesium" }, BA: { n: 56, name: "Barium" },
      LA: { n: 57, name: "Lanthan" }, CE: { n: 58, name: "Cerium" },
      PR: { n: 59, name: "Praseo" }, ND: { n: 60, name: "Neodym" },
      AU: { n: 79, name: "Gold" }, HG: { n: 80, name: "Mercury" },
      PB: { n: 82, name: "Lead" }, U: { n: 92, name: "Uraniu" },
      PU: { n: 94, name: "Pluton" }
    };

    // 2. Devanagari Transliteration
    const DEVA_MAP = {
      'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'ng','च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'ny',
      'ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n','त':'t','थ':'th','द':'d','ध':'dh','न':'n',
      'प':'p','फ':'ph','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'v','श':'sh',
      'ष':'sh','स':'s','ह':'h','अ':'a','आ':'aa','इ':'i','ई':'ee','उ':'u','ऊ':'oo','ऋ':'ri',
      'ए':'e','ऐ':'ai','ओ':'o','औ':'au','ा':'aa','ि':'i','ी':'ee','ु':'u','ू':'oo','ृ':'ri',
      'े':'e','ै':'ai','ो':'o','ौ':'au','ं':'n','ँ':'n','ः':'h','्':''
    };

    function transliterateDevanagari(text) {
      let out = '';
      for (let char of text) {
        out += DEVA_MAP[char] !== undefined ? DEVA_MAP[char] : char;
      }
      return out;
    }

    // 3. Periodic Decomposer
    function findOptimalDecomposition(word) {
      const memo = new Map();

      function solve(index) {
        if (index >= word.length) return { score: 0, tokens: [] };
        if (memo.has(index)) return memo.get(index);

        let bestResult = null;

        if (index + 2 <= word.length) {
          const sub2 = word.slice(index, index + 2).toUpperCase();
          if (ELEMENTS[sub2]) {
            const next = solve(index + 2);
            const candidate = {
              score: next.score + 10,
              tokens: [{
                symbol: word[index].toUpperCase() + word[index + 1].toLowerCase(),
                info: ELEMENTS[sub2],
                isElement: true
              }, ...next.tokens]
            };
            if (!bestResult || candidate.score > bestResult.score) bestResult = candidate;
          }
        }

        const sub1 = word[index].toUpperCase();
        if (ELEMENTS[sub1]) {
          const next = solve(index + 1);
          const candidate = {
            score: next.score + 5,
            tokens: [{
              symbol: sub1,
              info: ELEMENTS[sub1],
              isElement: true
            }, ...next.tokens]
          };
          if (!bestResult || candidate.score > bestResult.score) bestResult = candidate;
        }

        const fallbackNext = solve(index + 1);
        const fallback = {
          score: fallbackNext.score - 1,
          tokens: [{
            symbol: word[index],
            info: null,
            isElement: false
          }, ...fallbackNext.tokens]
        };
        if (!bestResult || fallback.score > bestResult.score) bestResult = fallback;

        memo.set(index, bestResult);
        return bestResult;
      }

      return solve(0).tokens;
    }

    function renderLineElements(lineText) {
      const latinText = transliterateDevanagari(lineText);
      return latinText.split(/\s+/).map(word => {
        if (!word) return '';
        const tokens = findOptimalDecomposition(word);
        const innerTiles = tokens.map(t => {
          if (t.isElement) {
            return `
              <div class="element-tile">
                <span class="atomic-num">${t.info.n}</span>
                <span class="symbol">${t.symbol}</span>
                <span class="name">${t.info.name}</span>
              </div>
            `;
          }
          return `<span class="plain-char">${t.symbol}</span>`;
        }).join('');

        return `<div class="word-box">${innerTiles}</div>`;
      }).join(' ');
    }

    // 4. LRC Parser
    function parseLRC(lrcText) {
      const lines = lrcText.split('\n');
      const result = [];
      const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

      lines.forEach(line => {
        const match = line.match(timeRegex);
        if (match) {
          const minutes = parseInt(match[1], 10);
          const seconds = parseInt(match[2], 10);
          const ms = parseFloat('0.' + match[3]);
          const totalSeconds = minutes * 60 + seconds + ms;
          const text = line.replace(timeRegex, '').trim();
          if (text) result.push({ time: totalSeconds, text });
        }
      });
      return result.sort((a, b) => a.time - b.time);
    }

    // 5. YouTube API Setup
    let ytPlayer = null;
    let ytReady = false;
    let pendingVideoId = null;
    let syncInterval = null;
    let lyricsData = [];
    let isUserSeeking = false;

    const playBtn = document.getElementById('togglePlayBtn');
    const seekBar = document.getElementById('seekBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const statusText = document.getElementById('statusDisplay');
    const trackName = document.getElementById('trackName');
    const viewport = document.getElementById('lyricsViewport');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');

    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('ytPlayerTarget', {
        height: '120',
        width: '200',
        playerVars: {
          autoplay: 1,
          controls: 0,
          playsinline: 1,
          enablejsapi: 1,
          origin: window.location.origin
        },
        events: {
          onReady: () => {
            ytReady = true;
            if (pendingVideoId) {
              ytPlayer.loadVideoById(pendingVideoId);
              pendingVideoId = null;
            }
          },
          onStateChange: onPlayerStateChange,
          onError: (e) => {
            console.warn('YouTube playback error:', e.data);
            statusText.textContent = 'Playback blocked for this video. Tap play to retry.';
          }
        }
      });
    };

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        playBtn.textContent = '⏸';
        statusText.textContent = 'Playing';
        startSyncLoop();
      } else if (event.data === YT.PlayerState.PAUSED) {
        playBtn.textContent = '▶';
        statusText.textContent = 'Paused';
        clearInterval(syncInterval);
      } else if (event.data === YT.PlayerState.BUFFERING) {
        statusText.textContent = 'Buffering...';
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60) || 0;
      const secs = Math.floor(seconds % 60) || 0;
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function startSyncLoop() {
      clearInterval(syncInterval);
      syncInterval = setInterval(() => {
        if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;

        const currentSec = ytPlayer.getCurrentTime() || 0;
        const duration = ytPlayer.getDuration() || 0;

        if (!isUserSeeking && duration > 0) {
          seekBar.value = (currentSec / duration) * 100;
          timeDisplay.textContent = `${formatTime(currentSec)} / ${formatTime(duration)}`;
        }

        if (lyricsData.length === 0) return;

        lyricsData.forEach((line, idx) => {
          const nextLine = lyricsData[idx + 1];
          const lineElem = document.getElementById(`lyric-${idx}`);

          if (currentSec >= line.time && (!nextLine || currentSec < nextLine.time)) {
            if (lineElem && !lineElem.classList.contains('active')) {
              document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
              lineElem.classList.add('active');
              lineElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }
        });
      }, 250);
    }

    // 6. Resilient Video Resolver
    async function resolveYouTubeVideoId(query) {
      const cleanTerm = query.replace(/\(.*?\)/g, '').replace(/\[.*?\]/g, '').trim();
      const endpoints = [
        `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(cleanTerm + ' audio')}&filter=videos`,
        `https://yewtu.be/api/v1/search?q=${encodeURIComponent(cleanTerm + ' audio')}&type=video`,
        `https://invidious.nerdvpn.de/api/v1/search?q=${encodeURIComponent(cleanTerm + ' audio')}&type=video`
      ];

      for (const url of endpoints) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 2500);
          const res = await fetch(url, { signal: controller.signal });
          clearTimeout(timer);

          if (!res.ok) continue;
          const data = await res.json();
          const items = data.items || data;
          if (Array.isArray(items) && items.length > 0) {
            const first = items[0];
            const vid = first.videoId || (first.url && first.url.replace('/watch?v=', ''));
            if (vid && vid.length >= 8) return vid;
          }
        } catch (e) {}
      }

      // Built-in popular track fallbacks
      const lower = cleanTerm.toLowerCase();
      if (lower.includes('gehra')) return 'mNUX_3-LwS8';
      if (lower.includes('kesariya')) return 'BddP6PYo2gs';
      if (lower.includes('believer')) return '7wtfhZwyrcc';
      if (lower.includes('radioactive')) return 'ktvTqknDobU';

      return 'mNUX_3-LwS8'; // Default fallback
    }

    // 7. Search & Play
    async function searchAndPlay(rawQuery) {
      const query = rawQuery.trim();
      if (!query) return;

      statusText.textContent = `Finding "${query}"...`;
      trackName.textContent = query;
      lyricsData = [];

      try {
        // Fetch Synced Lyrics
        const lrcRes = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`);
        const lrcList = await lrcRes.json();

        if (Array.isArray(lrcList) && lrcList.length > 0) {
          const matched = lrcList.find(t => t.syncedLyrics) || lrcList[0];
          trackName.textContent = `${matched.artistName} - ${matched.trackName}`;
          viewport.innerHTML = '';

          if (matched.syncedLyrics) {
            lyricsData = parseLRC(matched.syncedLyrics);
            lyricsData.forEach((line, idx) => {
              const lineDiv = document.createElement('div');
              lineDiv.className = 'lyric-line';
              lineDiv.id = `lyric-${idx}`;
              lineDiv.innerHTML = renderLineElements(line.text);
              lineDiv.onclick = () => {
                if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
                  ytPlayer.seekTo(line.time, true);
                  ytPlayer.playVideo();
                }
              };
              viewport.appendChild(lineDiv);
            });
          }
        }
      } catch (err) {
        console.error('Lyrics fetch error:', err);
      }

      // Fetch Video ID & Play
      const videoId = await resolveYouTubeVideoId(query);
      if (videoId) {
        if (ytReady && ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
          ytPlayer.loadVideoById(videoId);
          ytPlayer.playVideo();
        } else {
          pendingVideoId = videoId;
        }
      }
    }

    // 8. Event Listeners (Controls)
    playBtn.addEventListener('click', () => {
      if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    });

    seekBar.addEventListener('input', () => { isUserSeeking = true; });
    seekBar.addEventListener('change', () => {
      if (ytPlayer && typeof ytPlayer.getDuration === 'function') {
        const duration = ytPlayer.getDuration() || 0;
        const seekToSec = (seekBar.value / 100) * duration;
        ytPlayer.seekTo(seekToSec, true);
      }
      isUserSeeking = false;
    });

    searchBtn.addEventListener('click', () => searchAndPlay(searchInput.value));
    searchInput.addEventListener('keydown', (e) => {
